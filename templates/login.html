<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="box smallbox">
<h1>🏔 Админ-панель</h1>
<p class="muted">Посвящение в Горную Академию</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}
<form method="post">
<label>Логин</label><input name="login" autocomplete="username" required>
<label>Пароль</label><input name="password" type="password" autocomplete="current-password" required>
<button class="primary">Войти</button>
</form>
</div>
</body></html>
